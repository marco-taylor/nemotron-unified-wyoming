name: GHCR main image (latest and dev, linux/amd64)
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish latest and dev from main (no official release)'
        type: boolean
        required: true
        default: false
      validated_digest:
        description: 'Optional immutable public image digest to promote after rebuilding and testing main'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ghcr-main
  cancel-in-progress: true
jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Audit sources and history before building
        run: |
          python3 scripts/check_model_source.py
          python3 scripts/audit_publication.py
          python3 scripts/audit_publication.py --history
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and test before publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          target: runtime
          load: true
          push: false
          tags: nemotron-reviewed:main
          labels: |
            org.opencontainers.image.source=https://github.com/marco-taylor/nemotron-unified-wyoming
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Select previously validated image for explicit promotion
        if: github.event_name == 'workflow_dispatch' && inputs.validated_digest != ''
        env:
          VALIDATED_DIGEST: ${{ inputs.validated_digest }}
        run: |
          set -eu
          printf '%s\n' "$VALIDATED_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          IMAGE=ghcr.io/marco-taylor/nemotron-unified-wyoming
          # Pull before login: a promoted candidate must already be public.
          docker pull "$IMAGE@$VALIDATED_DIGEST"
          docker tag "$IMAGE@$VALIDATED_DIGEST" nemotron-reviewed:main
      - name: Verify architecture, runtime and absence of model weights
        run: |
          test "$(docker image inspect nemotron-reviewed:main --format '{{.Architecture}}')" = amd64
          docker run --rm --network none nemotron-reviewed:main --version
          id=$(docker create nemotron-reviewed:main --version)
          trap 'docker rm "$id" >/dev/null' EXIT
          docker export "$id" | python3 scripts/audit_runtime_image.py
      - name: Verify real public model initialization before pushing tags
        run: |
          set -eu
          name="nemotron-model-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$name" || true
            docker stop --time 60 "$name" >/dev/null 2>&1 || true
            docker rm "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "$name" --read-only --network bridge \
            --cap-drop ALL --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true --memory 4g --cpus 2 --pids-limit 128 \
            --tmpfs /models:size=1g,uid=99,gid=100,mode=0755,noexec,nosuid,nodev \
            --tmpfs /tmp:size=16m,noexec,nosuid,nodev nemotron-reviewed:main
          ready=false
          for attempt in $(seq 1 600); do
            if [ "$(docker inspect "$name" --format '{{.State.Running}}')" != true ]; then exit 1; fi
            if [ "$(docker inspect "$name" --format '{{.State.Health.Status}}')" = healthy ]; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          docker exec "$name" /usr/local/bin/docker-entrypoint.sh healthcheck
          docker logs "$name" 2>&1 | grep -q 'model-init: verified and installed encoder.int8.onnx'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish latest, compatibility dev and exact commit tags
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE=ghcr.io/marco-taylor/nemotron-unified-wyoming
          docker tag nemotron-reviewed:main "$IMAGE:latest"
          docker tag nemotron-reviewed:main "$IMAGE:dev"
          docker tag nemotron-reviewed:main "$IMAGE:sha-$COMMIT_SHA"
          docker push "$IMAGE:sha-$COMMIT_SHA"
          docker push "$IMAGE:dev"
          docker push "$IMAGE:latest"
