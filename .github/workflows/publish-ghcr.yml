name: GHCR main image (latest and dev, linux/amd64)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish latest and dev from main (no official release)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ghcr-main
  cancel-in-progress: true
jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Audit sources and history before building
        run: |
          python3 scripts/check_model_source.py
          python3 scripts/audit_publication.py
          python3 scripts/audit_publication.py --history
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and test before publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          target: runtime
          load: true
          push: false
          tags: nemotron-reviewed:main
          labels: |
            org.opencontainers.image.source=https://github.com/marco-taylor/nemotron-unified-wyoming
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify architecture, runtime and absence of model weights
        run: |
          test "$(docker image inspect nemotron-reviewed:main --format '{{.Architecture}}')" = amd64
          docker run --rm --network none nemotron-reviewed:main --version
          id=$(docker create nemotron-reviewed:main --version)
          trap 'docker rm "$id" >/dev/null' EXIT
          docker export "$id" | python3 scripts/audit_runtime_image.py
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish latest, compatibility dev and exact commit tags
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE=ghcr.io/marco-taylor/nemotron-unified-wyoming
          docker tag nemotron-reviewed:main "$IMAGE:latest"
          docker tag nemotron-reviewed:main "$IMAGE:dev"
          docker tag nemotron-reviewed:main "$IMAGE:sha-$COMMIT_SHA"
          docker push "$IMAGE:sha-$COMMIT_SHA"
          docker push "$IMAGE:dev"
          docker push "$IMAGE:latest"
