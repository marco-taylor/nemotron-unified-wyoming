[package]
name = "nemotron-unified-rust-wyoming"
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.91"
publish = false

[features]
default = []
sherpa = ["dep:sherpa-onnx"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
sha2 = "0.10"
unicode-normalization = "0.1"
signal-hook = "0.3"
sherpa-onnx = { git = "https://github.com/k2-fsa/sherpa-onnx.git", rev = "31ba0e438f8065189a8e5589d84dfd7faf516d3d", default-features = false, features = ["shared"], optional = true }
